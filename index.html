<!DOCTYPE html>
<html lang="ku" id="html-root">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dodocare</title>
    <style>
        /* CSS دێ مینیت وەک خۆ، تەنێ ئەڤ بەشە بۆ ئەنیمەیشنا گۆتنێ یە */
        .fade-in { transition: opacity 0.6s ease-in-out; opacity: 1; }
        .fade-out { opacity: 0; }
        .heart-btn { cursor: pointer; font-size: 24px; transition: transform 0.2s; }
        .heart-btn:hover { transform: scale(1.2); }
    </style>
</head>
<body>

    <!-- Language Selector Modal -->
    <div id="intro-screen" style="position:fixed; top:0; left:0; width:100%; height:100%; background:#fdfbf7; z-index:9999; display:flex; flex-direction:column; justify-content:center; align-items:center;">
        <h1>Dodocare 🌸</h1>
        <div>
            <button onclick="setLanguage('ku')">کوردی</button>
            <button onclick="setLanguage('ar')">عربي</button>
            <button onclick="setLanguage('en')">English</button>
        </div>
    </div>

    <!-- سایتێ تە د ناڤ ڤی دیڤی دا دمینیت -->
    <div class="container" id="main-container">
        <!-- Streak Display -->
        <div class="streak-badge" id="streak-counter">🔥 ستریک: 0 ڕۆژێن بەردەوام</div>
        
        <!-- Quote Section -->
        <div class="card">
            <div id="daily-quote" class="fade-in">“ئەڤرۆ ڕۆژا تە یە!”</div>
            <span class="heart-btn" onclick="toggleFavorite()">🤍</span>
        </div>
    </div>

<script>
    // 1. لیستەیا هەمی گۆتنێن تە
    const quotes = [
        "ڕێزێ ل خۆ بگرە و دویر بکەڤە ژ هەر جهەکێ کو قەدرێ تە لێ نەبیت. — مەولانایێ ڕۆمی",
        "باشترین بەرسڤ بۆ مرۆڤێن نەزان، بێدەنگییە. — ئیمامێ شافعی",
        "ببە ئەو کەسێ کو تە دڤێت د ژیانێ دا ببینی، نە ئەو کەسێ کو خەلکی دڤێت. — مەهاتما گاندی",
        "ئەگەر تو هه‌ڤالینیێ دگەل چوار مرۆڤێن بێ ئارمانج بکەی، پشتڕاست بە کو تو دێ بیە یێ پێنجێ. — ئیدریس ئالبا",
        "کەسایەتیا تە د وێ ڕۆژێ دا دگەهیتە لوتکەیێ، دەمێ تو تێدگەهی کو تو تنێ بەرپرسێ بەختەوەریا خۆی. — ئەلبێرت کامۆ",
        "کەسێ کو جارەکێ درەو ل دگەل تە کر، پشتڕاست بە کو دێ بۆ جارا دووێ و سێیێ ژی کەت. — ئۆلیڤەر جۆنسمان",
        "مەزنترین تۆڵەسەندن ژ مرۆڤێن خاین و درەوین ئەوە، کو تو د ژیانا خۆ دا سەرکەفتی ببی و وان ب تەمامی ژ بیر بکەی. — فرانك سیناترا",
        "ئەگەر مرۆڤەکی خیانەت ل تە کر، ئەڤە خەلەتیا وی یە. بەس ئەگەر بۆ جارا دووێ خیانەت ل تە کر، ئەڤە خەلەتیا تە یە. — ئاندرێ جید",
        "کەسێ کو ل پێش چاڤێن تە بەحسێ خەلکی بکەت، پشتڕاست بە کو ل پشت تە ژی دێ بەحسێ تە کەت بۆ خەلکی. — ئیمامێ عەلی",
        "مەزنترین دۆژمن بۆ ساخلەمیا تە یا دەروونی، تێکەڵبوونا زێدەیە دگەل بابەتێن کو چ پەیوەندی ب تە ڤە نینە. — ئۆپرا وینفری",
        "مرۆڤێ ب هێز ئەو نینە یێ چ جاران نەکەفتی، بەلکو ئەو کەسە یێ پشتی هەر کەفتنەکێ ب هێزتر ڕادبیتە سەر پێیان. — کۆنفۆشیۆس",
        "ئەگەر تو بۆچوونا خەلکی بکەیە یاسایا ژیانا خۆ، تو چ جاران نەشێی ئازاد بژی. — فریدریش نیتشە",
        "خەڵک دێ هەر ئاخڤن، چ تو تشتێن باش بکەی یان خراپ. ڤێجا وی تشتێ بکە یا کو دل و ویژدانا تە پێ ڕازی بیت. — مارک تواین",
        "مەزنترین ئازادی د ژیانێ دا ئەوە کو تو خەمێ بۆ هندێ نەخۆی کا خەلک ل سەر تە چ هزر دکەن. — ئۆپرا وینفری",
        "ئەو کەسێ چ گرنگیێ ب سەرکەفتنا تە نەدەت، جهێ وی د ژیانا تە دا نینە. — مارک تواین",
        "بلا دەوروبەرێن تە تنێ ئەو بن یێن کو دلێ تە گەش دکەن و پشتەڤانیا تە دکەن. — ئۆپرا وینفری",
        "بەری حەژ کەسێ بکەی، فێربە کا دێ چەوا حەژ خۆ کەی. — بودا",
        "تو ژ هەژی باشترین تشتێن، چ جاران کێمتری مافێ خۆ قبوول نەکە. — مایا ئەنجێلۆ",
        "خۆ وەک خۆ قبوول بکە، تو یێ جودای و ئەڤە ژی جوانییا تە یە. — فریدریش",
        "خۆ ب کەسێ بەراورد نەکە، تو د ڕێکا خۆ یا تایبەت دا دچی. — بیل گەیتس",
        "گرنگیدان ب خۆ نە خۆپەرستییە، ئەڤە دەستپێکا ڕێزگرتنێیە ژ ژیانێ. — ئۆسکار وایڵد",
        "نەهێلە خەونێن تە تنێ د سەرێ تە دا بمینن، بکە کار. — ستیڤ جۆبس",
        "نەخۆشی دێ چن، بەس مرۆڤێن ب هێز دێ مینن. — ڕۆبێرت شولەر",
        "ترس تنێ خەیالەکە، وێ نەکە ڕاستی بۆ خۆ. — پائۆلۆ کۆیلۆ",
        "هەر ڕۆژەکا نوو، چانسەکێ نوویە بۆ گوهۆڕینێ. — ئەلبێرت ئاینشتاین"
    ];

    // 2. لۆژیکا ستریکێ (بێ سنور)
    let streak = parseInt(localStorage.getItem('dodo_infinite_streak') || 0);
    let lastVisit = localStorage.getItem('dodo_last_visit');
    let today = new Date().toDateString();

    if (lastVisit !== today) {
        streak++;
        localStorage.setItem('dodo_infinite_streak', streak);
        localStorage.setItem('dodo_last_visit', today);
    }
    document.getElementById('streak-counter').innerText = "🔥 ستریک: " + streak + " ڕۆژێن بەردەوام";

    // 3. لۆژیکا زمانێ و گۆتنا ڕۆژانە
    function setLanguage(lang) {
        document.getElementById('intro-screen').style.display = 'none';
        localStorage.setItem('dodo_lang', lang);
        showNewQuote();
    }

    function showNewQuote() {
        const quoteDiv = document.getElementById('daily-quote');
        quoteDiv.classList.add('fade-out');
        setTimeout(() => {
            quoteDiv.innerText = quotes[Math.floor(Math.random() * quotes.length)];
            quoteDiv.classList.remove('fade-out');
        }, 600);
    }

    function toggleFavorite() {
        const heart = document.querySelector('.heart-btn');
        heart.innerText = heart.innerText === '🤍' ? '❤️' : '🤍';
    }

    // دەستپێکرنا خودکاری
    if(localStorage.getItem('dodo_lang')) document.getElementById('intro-screen').style.display = 'none';
    showNewQuote();
</script>
</body>
</html>
